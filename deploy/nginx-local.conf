# Run with: nginx.exe -p <absolute workspace>/ -c deploy/nginx-local.conf
worker_processes 1;
error_log logs/mathrag-error.log warn;
pid logs/mathrag-nginx.pid;
events { worker_connections 256; }
http {
    # Deliberately exclude query strings, headers, cookies and request bodies.
    log_format safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent $request_time';
    access_log logs/mathrag-access.log safe;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff2 woff2;
        font/woff woff;
    }
    default_type application/octet-stream;
    sendfile on;
    gzip off;
    server {
        listen 127.0.0.1:8086;
        server_name localhost 127.0.0.1;
        root frontend/dist;
        index index.html;
        client_max_body_size 55m;
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
        location ~ ^/(api(?:/|$)|docs(?:/|$)|openapi\.json$) {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            # Preserve the port so backend same-origin / CSRF checks remain valid.
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering no;
            add_header Cache-Control "no-store";
        }
    }
}
